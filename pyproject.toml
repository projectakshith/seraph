[project]
name = "seraph-mcp"
version = "0.2.0"
description = "Query-adaptive, evolution-aware code retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
keywords = ["mcp", "code-search", "retrieval", "embeddings", "git", "coding-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "bm25s>=0.2.6",
    "PyStemmer>=2.2",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-php>=0.25",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-swift>=0.7",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-bash>=0.25",
    "tree-sitter-dart>=0.1",
    "tree-sitter-lua>=0.5",
    "tree-sitter-sql>=0.3",
    "tree-sitter-fortran>=0.6",
    "tree-sitter-scala>=0.26",
    "typer>=0.12",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
fast = ["model2vec>=0.9,<0.10", "huggingface-hub>=0.34"]
quality = [
    "torch>=2.4",
    "transformers>=4.51,<5",
    "sentence-transformers>=3.4,<6",
    "einops>=0.8",
]
cpu = [
    "torch>=2.4",
    # BGE-Code-v1 ships custom Transformers code that is not compatible with v5 yet.
    "transformers>=4.51,<5",
    "sentence-transformers>=3.4,<6",
    "faiss-cpu>=1.8",
    "einops>=0.8",
]
gpu = [
    "torch>=2.4",
    "transformers>=4.51,<5",
    "sentence-transformers>=3.4,<6",
    "faiss-cpu>=1.8",
    "einops>=0.8",
]
gemma2 = [
    "torch>=2.4",
    "transformers>=5.19,<6",
    "sentence-transformers>=6.1,<7",
    "faiss-cpu>=1.8",
    "einops>=0.8",
]
eval = [
    "mteb>=2.1,<3",
    "datasets>=2.20",
    "lightgbm>=4.3",
    "pillow>=12.3.0",
]
llm = ["openai>=1.40"]
api = [
    "google-genai>=1.20",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/projectakshith/seraph"
Repository = "https://github.com/projectakshith/seraph"

[project.scripts]
seraph = "seraph.cli:main"
seraph-mcp = "seraph.server:main"
seraph-eval = "seraph.evaluation.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/seraph", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/seraph"]

[tool.uv]
python-preference = "managed"
conflicts = [
    [{ extra = "quality" }, { extra = "cpu" }],
    [{ extra = "quality" }, { extra = "gpu" }],
    [{ extra = "quality" }, { extra = "gemma2" }],
    [{ extra = "cpu" }, { extra = "gpu" }],
    [{ extra = "cpu" }, { extra = "gemma2" }],
    [{ extra = "gpu" }, { extra = "gemma2" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not gpu and not network'"
markers = ["gpu: requires CUDA and model downloads", "network: requires network access"]
